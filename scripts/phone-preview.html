<!doctype html>
<meta charset="utf-8">
<title>Khung xem điện thoại</title>
<style>
  body { margin: 0; background: #111; display: flex; gap: 24px; padding: 20px; font: 12px system-ui; color: #ccc; }
  figure { margin: 0; }
  figcaption { text-align: center; padding: 6px 0; }
  iframe { width: 390px; height: 844px; border: 1px solid #444; border-radius: 12px; background: #000; }
</style>
<figure>
  <iframe id="a" src="/de/erleben"></iframe>
  <figcaption id="ca">/de/erleben — 390 × 844</figcaption>
</figure>
<figure>
  <iframe id="b" src="/de/speisekarte"></iframe>
  <figcaption id="cb">/de/speisekarte</figcaption>
</figure>
<figure>
  <iframe id="c" src="/de/bestellen"></iframe>
  <figcaption id="cc">/de/bestellen</figcaption>
</figure>
<script>
  // ?a=/path&b=/path&c=/path để đổi trang trong từng khung
  const q = new URLSearchParams(location.search);
  for (const key of ['a', 'b', 'c']) {
    const path = q.get(key);
    if (path) {
      document.getElementById(key).src = path;
      document.getElementById('c' + key).textContent = path;
    }
  }
</script>

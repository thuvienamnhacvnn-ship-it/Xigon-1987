# www.xigon1987.com — step 2 of 2: HTTPS.
#
# Only install this once the certificate exists. nginx refuses to start when a
# server block names a certificate file that is not there, and this nginx also
# serves ptc-bonus.com and ptc-hub.org — so installing this too early does not
# break one site, it breaks three.
#
#   docker run --rm \
#     -v ptc-bonus_certbot_conf:/etc/letsencrypt \
#     -v ptc-bonus_certbot_www:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d www.xigon1987.com -d xigon1987.com \
#     --email <address> --agree-tos --no-eff-email
#
# Then swap the files and reload:
#   rm  …/conf.d/xigon1987.conf
#   scp deploy/nginx/xigon1987-https.conf root@…:…/conf.d/xigon1987.conf
#   docker exec ptc-bonus-nginx-1 nginx -t && docker exec ptc-bonus-nginx-1 nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name www.xigon1987.com xigon1987.com;

    # Renewal comes back to this path every ninety days. It stays on port 80 and
    # it stays above the redirect, or the renewal fails silently and the site
    # goes dark three months later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.xigon1987.com$request_uri;
    }
}

# The bare name sends people to the one with www, so there is a single address.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xigon1987.com;

    ssl_certificate     /etc/letsencrypt/live/www.xigon1987.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.xigon1987.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    return 301 https://www.xigon1987.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xigon1987.com;

    ssl_certificate     /etc/letsencrypt/live/www.xigon1987.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.xigon1987.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # The app is a plain Node service on the host, not a container, so it is
    # reached through the bridge gateway. Held in a variable for the same reason
    # the other sites here do it: nginx resolves a literal upstream at start-up,
    # and one unreachable upstream in one file stops the whole server.
    set $xigon_app "172.18.0.1:3060";

    # Enough for the pictures and short clips an admin uploads for an offer;
    # the server itself refuses anything over 6 MB for a picture and 4 MB for a
    # clip, and this is the outer wall in front of that.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # This is the header the app reads to decide whether its cookies may be
    # marked Secure. Behind this block it says https, and they are.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /_next/static/ {
        proxy_pass http://$xigon_app$request_uri;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://$xigon_app$request_uri;
    }
}

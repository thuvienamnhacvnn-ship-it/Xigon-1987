# xigon1987.com — the domain bought by mistake, kept and pointed at the real one.
#
# It is not deleted, for the reason old addresses are never deleted: it has been
# live, it has a certificate, and anyone who wrote it down or linked to it would
# otherwise land on nothing. A redirect costs a line of config and keeps every
# one of those links working.
#
# Install this INSTEAD of xigon1987-https.conf, and only after
# www.1987xigon.com has its own certificate and serves the site — until then
# this one is still the address that works.
#
#   scp deploy/nginx/xigon1987-redirect.conf \
#       root@162.19.44.241:/opt/ptc-bonus/PTC-Loyalty/docker/nginx/conf.d/xigon1987.conf
#   docker exec ptc-bonus-nginx-1 nginx -t && docker exec ptc-bonus-nginx-1 nginx -s reload
#
# The certificate for xigon1987.com stays and keeps renewing. It has to: a guest
# arriving at https://xigon1987.com gets the TLS handshake before the redirect,
# so a missing certificate there is a browser warning, not a clean forward.

server {
    listen 80;
    listen [::]:80;
    server_name www.xigon1987.com xigon1987.com;

    # Renewal still comes back here every ninety days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.1987xigon.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xigon1987.com xigon1987.com;

    ssl_certificate     /etc/letsencrypt/live/www.xigon1987.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.xigon1987.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # The path is carried across, so a link to a dish on the old name opens that
    # dish on the new one rather than the front door.
    return 301 https://www.1987xigon.com$request_uri;
}

# www.1987xigon.com — step 1 of 2: plain HTTP.
#
# The restaurant's own name is 1987xigon, which is also the name on its e-mail
# address. xigon1987.com was bought first by mistake; it keeps working and
# sends people here, because a domain that has been handed out once is a domain
# somebody has written down.
#
# This file answers the moment DNS points at this server, and it is what Let's
# Encrypt fetches its proof from. Replace it with 1987xigon-https.conf once
# `certbot certonly` has succeeded — a config naming a certificate that does not
# exist yet stops nginx from starting, and this nginx also serves ptc-bonus.com,
# ptc-hub.org and xigon1987.com.
#
# Install with scp, never by piping through PowerShell — see docs/DEPLOY.md for
# the two different ways that has corrupted a config file here.
#
#   scp deploy/nginx/1987xigon.conf \
#       root@162.19.44.241:/opt/ptc-bonus/PTC-Loyalty/docker/nginx/conf.d/
#   docker exec ptc-bonus-nginx-1 nginx -t && \
#   docker exec ptc-bonus-nginx-1 nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name www.1987xigon.com 1987xigon.com;

    # The proof Let's Encrypt comes back for, every ninety days. Above the
    # catch-all, and it stays in the HTTPS version of this file too.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # One address, so a guest and a search engine never meet the same page twice.
    if ($host = 1987xigon.com) {
        return 301 http://www.1987xigon.com$request_uri;
    }

    # The app is a plain Node service on the host, not a container, so it is
    # reached through the bridge gateway. Held in a variable because nginx
    # resolves a literal upstream at start-up: one unreachable name in one file
    # and the whole server refuses to come up, taking the other sites with it.
    set $xigon_app "172.18.0.1:3060";

    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The app marks its cookies Secure off this header, so it has to be honest:
    # over plain HTTP it says http, and the basket keeps working.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /_next/static/ {
        proxy_pass http://$xigon_app$request_uri;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://$xigon_app$request_uri;
    }
}

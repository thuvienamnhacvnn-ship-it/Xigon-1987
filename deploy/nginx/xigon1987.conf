# www.xigon1987.com — step 1 of 2: plain HTTP.
#
# This file is what the site runs on between the moment DNS points at this
# server and the moment a certificate exists. It cannot be skipped: Let's
# Encrypt proves the domain by fetching a file over HTTP from this very server,
# so the HTTP host has to answer before there is anything to answer with.
#
# Replace it with xigon1987-https.conf once `certbot certonly` has succeeded.
# A config naming a certificate that is not there yet stops nginx from starting
# at all — and this nginx also serves ptc-bonus.com and ptc-hub.org, so a
# missing file here takes those down with it.
#
# Lives in the repo rather than only on the server because the last thing a
# server should hold is the only copy of how it is configured.
#
# Install:
#   scp deploy/nginx/xigon1987.conf \
#       root@162.19.44.241:/opt/ptc-bonus/PTC-Loyalty/docker/nginx/conf.d/
#   docker exec ptc-bonus-nginx-1 nginx -t && \
#   docker exec ptc-bonus-nginx-1 nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name www.xigon1987.com xigon1987.com;

    # The proof Let's Encrypt comes back for. Must stay above the catch-all
    # location, and must stay in the HTTPS version of this file too — renewal
    # uses the same path every ninety days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # One name, so a guest and a search engine never see the same page twice.
    # The guest asked for www, so www is the one.
    if ($host = xigon1987.com) {
        return 301 http://www.xigon1987.com$request_uri;
    }

    # The app is a plain Node service on the host, not a container, so it is
    # reached through the bridge gateway. Held in a variable for the same reason
    # the other sites here do it: nginx resolves a literal upstream at start-up,
    # and one unreachable upstream in one file stops the whole server — which
    # would take ptc-bonus.com and ptc-hub.org down with it.
    set $xigon_app "172.18.0.1:3060";

    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The app marks its cookies Secure off this header, so it has to be honest:
    # over plain HTTP it says http, and the basket keeps working.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /_next/static/ {
        proxy_pass http://$xigon_app$request_uri;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://$xigon_app$request_uri;
    }
}
